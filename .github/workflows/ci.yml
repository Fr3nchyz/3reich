name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The full browser suite also runs once a night and on demand (Actions tab, "Run workflow"), so a break the per-pull-request rule missed is caught within a day.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
# Superseded pull request runs are cancelled; pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Decides whether the browser tests are needed. They are slow, so they run nightly, on demand ("Run workflow"), and on a pull request only for a
  # change that touches everything: the dependencies, the build or test config, the page shell or this workflow, or when the pull request carries the
  # label "run-e2e". Ordinary feature, engine, screen, data and docs pull requests skip them; the nightly run catches what they miss. A push to main skips
  # them too. Lint, typecheck, unit tests and the build run for every change (some unit tests read the docs).
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.scope.outputs.e2e }}
      compare-games: ${{ steps.compare-scope.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: compare-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          if echo "$changed" | grep -qE '^src/(engine|ai|data)/'; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then echo "e2e=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" != "pull_request" ]; then echo "e2e=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          if echo "$LABELS" | grep -q '"run-e2e"' || echo "$changed" | grep -qE '^(package(-lock)?\.json|vite\.config\.ts|playwright\.config\.ts|index\.html|\.github/workflows/)'; then echo "e2e=true" >> "$GITHUB_OUTPUT"; else echo "e2e=false" >> "$GITHUB_OUTPUT"; fi
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests with the coverage floor for src/engine (thresholds in vite.config.ts).
      - run: npm run coverage
      - run: npm run build
  # Informational only; branch protection continues to use the existing checks.
  compare-games:
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.compare-games == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: compare
        shell: bash
        continue-on-error: true
        run: npm run compare-games | tee "$RUNNER_TEMP/compare-games.txt"
      - name: Write job summary
        if: always() && steps.compare.outcome != 'skipped'
        run: cat "$RUNNER_TEMP/compare-games.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Update comparison comment
        if: >-
          !cancelled() && steps.compare.outcome != 'skipped' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- compare-games-summary -->';
            const summary = fs.readFileSync(`${process.env.RUNNER_TEMP}/compare-games.txt`, 'utf8');
            const body = `${marker}\n## Whole-game comparison\n\n${summary}\n\n[CI run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const previous = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
  # Browser tests against `vite preview` on a build made for them (see playwright.config.ts), in three parallel shards so the wait is a third as long.
  e2e-shard:
    needs: scope
    if: needs.scope.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
  # The one check that branch protection requires ("e2e"): a matrix job reports as "e2e (1)" to "e2e (3)", which never satisfies it.
  # Passes when the shards passed or were skipped (no browser tests needed), fails otherwise.
  e2e:
    needs: [scope, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
        run: |
          echo "scope: $SCOPE, shards: $SHARDS"
          [ "$SCOPE" = "success" ] && { [ "$SHARDS" = "success" ] || [ "$SHARDS" = "skipped" ]; }
